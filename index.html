<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>매일 운동 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow training-log column — today's entry card on top, the month's report below. */
:root{
  --bg:#eeeff0; --surface:#ffffff; --ink:#2f3a42; --muted:#6c7a84; --line:#dcdfe2;
  --beige:#4fa3d6; --gray:#6e7378; --on:#ffffff;
  --swim:var(--beige); --run:var(--beige); --push:var(--gray); --hang:var(--gray);
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121b22; --surface:#1a262f; --ink:#e4eef5; --muted:#93a6b3; --line:#2c3e4b;
  --beige:#8ccdf2; --gray:#9ca3a9; --on:#121b22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121b22; --surface:#1a262f; --ink:#e4eef5; --muted:#93a6b3; --line:#2c3e4b;
  --beige:#8ccdf2; --gray:#9ca3a9; --on:#121b22; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,40px);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.nav{display:flex;align-items:center;gap:8px}
.nav .label{flex:1;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.nav button,.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;height:36px;min-width:36px;padding:0 12px;font:inherit;cursor:pointer}
.nav button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.today-btn{font-size:13px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.items{grid-template-columns:1fr}}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .t{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.check{appearance:none;width:100%;height:48px;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.check[aria-pressed="true"]{border-style:solid;color:var(--on)}
#swimBtn[aria-pressed="true"]{background:var(--swim);border-color:var(--swim)}
#hangBtn[aria-pressed="true"]{background:var(--hang);border-color:var(--hang)}
.num{display:flex;align-items:center;gap:6px}
.num input{flex:1;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 20px var(--mono);padding:0 12px;text-align:right}
.num .unit{font-size:14px;color:var(--muted);width:24px}
.step{width:40px;height:48px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.summary{grid-template-columns:repeat(2,1fr)}}
.stat{padding:10px 12px;border-left:3px solid var(--c);display:flex;flex-direction:column}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.stat .v small{font:13px var(--body);color:var(--muted);margin-left:2px}
.chart{display:flex;flex-direction:column;gap:6px}
.chart .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.chart .ct b{font-size:15px}
.chart .ct span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{fill:var(--muted);font:11px var(--mono)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days .d{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--bg);display:grid;place-items:center;font:11px var(--mono);color:var(--muted)}
.days .d.on{background:var(--c);color:var(--on)}
.days .d.blank{background:transparent}
.days .d.today{outline:1.5px solid var(--ink)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.cal2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:560px){.cal2{grid-template-columns:1fr}}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <h1>매일 운동 기록장</h1>
    <span class="status" id="status">불러오는 중…</span>
  </div>

  <section class="card" aria-labelledby="dayTitle">
    <h2 id="dayTitle">오늘의 체크</h2>
    <div class="nav">
      <button id="prevDay" aria-label="전날">‹</button>
      <div class="label" id="dayLabel"></div>
      <button id="nextDay" aria-label="다음날">›</button>
      <button id="goToday" class="btn today-btn">오늘</button>
    </div>
    <div class="items">
      <div class="item">
        <div class="t"><span class="dot" style="background:var(--swim)"></span>수영</div>
        <button class="check" id="swimBtn" aria-pressed="false">수영 안 함</button>
      </div>
      <div class="item">
        <div class="t"><span class="dot" style="background:var(--hang)"></span>매달리기</div>
        <button class="check" id="hangBtn" aria-pressed="false">매달리기 안 함</button>
      </div>
      <div class="item">
        <div class="t"><span class="dot" style="background:var(--run)"></span>달리기</div>
        <div class="num">
          <button class="step" data-f="run" data-d="-1" aria-label="1km 빼기">−</button>
          <input id="runIn" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0">
          <span class="unit">km</span>
          <button class="step" data-f="run" data-d="1" aria-label="1km 더하기">+</button>
        </div>
      </div>
      <div class="item">
        <div class="t"><span class="dot" style="background:var(--push)"></span>푸시업</div>
        <div class="num">
          <button class="step" data-f="push" data-d="-5" aria-label="5개 빼기">−</button>
          <input id="pushIn" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
          <span class="unit">개</span>
          <button class="step" data-f="push" data-d="5" aria-label="5개 더하기">+</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="monthTitle">
    <div class="nav">
      <button id="prevMonth" aria-label="이전 달">‹</button>
      <div class="label" id="monthTitle"></div>
      <button id="nextMonth" aria-label="다음 달">›</button>
    </div>
    <div class="summary">
      <div class="stat" style="--c:var(--swim)"><span class="k">수영</span><span class="v" id="sSwim">0<small>일</small></span></div>
      <div class="stat" style="--c:var(--hang)"><span class="k">매달리기</span><span class="v" id="sHang">0<small>일</small></span></div>
      <div class="stat" style="--c:var(--run)"><span class="k">달리기 합계</span><span class="v" id="sRun">0<small>km</small></span></div>
      <div class="stat" style="--c:var(--push)"><span class="k">푸시업 합계</span><span class="v" id="sPush">0<small>개</small></span></div>
    </div>
    <p class="empty" id="emptyNote" hidden>이 달에는 아직 기록이 없어요. 위에서 날짜를 고르고 체크하면 그래프에 바로 나타나요.</p>

    <div class="chart">
      <div class="ct"><b>달리기 (km)</b><span id="runMeta"></span></div>
      <svg id="runChart" viewBox="0 0 640 190" role="img" aria-label="일별 달리기 거리 막대그래프"></svg>
    </div>
    <div class="chart">
      <div class="ct"><b>푸시업 (개)</b><span id="pushMeta"></span></div>
      <svg id="pushChart" viewBox="0 0 640 190" role="img" aria-label="일별 푸시업 개수 막대그래프"></svg>
    </div>
    <div class="cal2">
      <div class="chart">
        <div class="ct"><b>수영한 날</b><span id="swimMeta"></span></div>
        <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="days" id="swimCal" style="--c:var(--swim)"></div>
      </div>
      <div class="chart">
        <div class="ct"><b>매달리기한 날</b><span id="hangMeta"></span></div>
        <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="days" id="hangCal" style="--c:var(--hang)"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const WD = ["일","월","화","수","목","금","토"];
  const pad = n => String(n).padStart(2,"0");
  const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const today = new Date(); today.setHours(0,0,0,0);

  let data = {};            // "YYYY-MM-DD" -> {swim,hang,run,push}
  let cur = new Date(today); // selected day
  let mon = new Date(today.getFullYear(), today.getMonth(), 1);
  let store = null;          // db collection ref or null
  const LS = "workout-log-v1";

  function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ return {}; } }
  function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){} }
  function setStatus(t){ $("status").textContent = t; }

  // ----- day entry -----
  function entry(k){ return data[k] || {swim:false,hang:false,run:0,push:0}; }
  function renderDay(){
    const k = key(cur), e = entry(k);
    const isToday = k === key(today);
    $("dayTitle").textContent = isToday ? "오늘의 체크" : "기록 수정";
    $("dayLabel").textContent = `${cur.getMonth()+1}월 ${cur.getDate()}일 (${WD[cur.getDay()]})`;
    $("nextDay").disabled = isToday;
    setToggle("swimBtn", e.swim, "수영 완료 ✓", "수영 안 함");
    setToggle("hangBtn", e.hang, "매달리기 완료 ✓", "매달리기 안 함");
    if (document.activeElement !== $("runIn")) $("runIn").value = e.run ? e.run : "";
    if (document.activeElement !== $("pushIn")) $("pushIn").value = e.push ? e.push : "";
  }
  function setToggle(id, on, yes, no){ const b=$(id); b.setAttribute("aria-pressed", on?"true":"false"); b.textContent = on?yes:no; }

  const timers = {};
  function update(patch){
    const k = key(cur);
    const e = Object.assign({}, entry(k), patch);
    e.run = Math.max(0, Math.round((+e.run||0)*10)/10);
    e.push = Math.max(0, Math.round(+e.push||0));
    data[k] = e;
    renderDay(); renderMonth();
    clearTimeout(timers[k]);
    timers[k] = setTimeout(()=>persist(k, e), 400);
  }
  async function persist(k, e){
    lsSave();
    if (!store) { setStatus("이 브라우저에 저장됨"); return; }
    setStatus("저장 중…");
    try { await store.doc(k).set({date:k, swim:!!e.swim, hang:!!e.hang, run:e.run, push:e.push}); setStatus("저장됨"); }
    catch(err){ setStatus("저장 실패: 연결을 확인한 뒤 다시 입력해 주세요"); }
  }

  $("swimBtn").onclick = () => update({swim: !entry(key(cur)).swim});
  $("hangBtn").onclick = () => update({hang: !entry(key(cur)).hang});
  $("runIn").oninput = e => update({run: parseFloat(e.target.value)||0});
  $("pushIn").oninput = e => update({push: parseInt(e.target.value)||0});
  document.querySelectorAll(".step").forEach(b => b.onclick = () => {
    const f = b.dataset.f, d = parseFloat(b.dataset.d);
    const v = Math.max(0, (entry(key(cur))[f]||0) + d);
    update({[f]: v}); $(f==="run"?"runIn":"pushIn").value = v ? (f==="run"? Math.round(v*10)/10 : v) : "";
  });
  function shiftDay(n){ const d=new Date(cur); d.setDate(d.getDate()+n); if (d>today) return; cur=d; mon=new Date(d.getFullYear(), d.getMonth(), 1); renderDay(); renderMonth(); }
  $("prevDay").onclick = () => shiftDay(-1);
  $("nextDay").onclick = () => shiftDay(1);
  $("goToday").onclick = () => { cur=new Date(today); mon=new Date(today.getFullYear(), today.getMonth(),1); renderDay(); renderMonth(); };
  $("prevMonth").onclick = () => { mon=new Date(mon.getFullYear(), mon.getMonth()-1, 1); renderMonth(); };
  $("nextMonth").onclick = () => { mon=new Date(mon.getFullYear(), mon.getMonth()+1, 1); renderMonth(); };

  // ----- month report -----
  function niceMax(v){ if (v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
  function fmt(v){ return Number.isInteger(v)? String(v) : v.toFixed(1); }
  function bars(svg, vals, color, unit){
    const W=640,H=190,L=34,R=8,T=14,B=24, n=vals.length;
    const max=niceMax(Math.max(...vals)), cw=(W-L-R)/n, bw=Math.max(3, cw*0.62);
    let s="";
    for (let i=0;i<=4;i++){ const v=max*i/4, y=T+(H-T-B)*(1-i/4);
      s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
      s+=`<text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; }
    const top = Math.max(...vals);
    vals.forEach((v,i)=>{
      const x=L+i*cw+(cw-bw)/2, h=(H-T-B)*(v/max), y=H-B-h;
      if (v>0) s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${color}"><title>${i+1}일: ${fmt(v)}${unit}</title></rect>`;
      if (v>0 && v===top) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${fmt(v)}</text>`;
      const d=i+1; if (d===1 || d%5===0) s+=`<text x="${(L+i*cw+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${d}</text>`;
    });
    svg.innerHTML = s;
  }
  function cal(el, flags, y, m){
    const first = new Date(y,m,1).getDay(); let s="";
    for (let i=0;i<first;i++) s+=`<div class="d blank"></div>`;
    flags.forEach((on,i)=>{ const isT = y===today.getFullYear() && m===today.getMonth() && i+1===today.getDate();
      s+=`<div class="d${on?" on":""}${isT?" today":""}">${i+1}</div>`; });
    el.innerHTML = s;
  }
  function renderMonth(){
    const y=mon.getFullYear(), m=mon.getMonth(), n=new Date(y,m+1,0).getDate();
    $("monthTitle").textContent = `${y}년 ${m+1}월`;
    $("nextMonth").disabled = (y>today.getFullYear()) || (y===today.getFullYear() && m>=today.getMonth());
    const rows = Array.from({length:n},(_,i)=>entry(`${y}-${pad(m+1)}-${pad(i+1)}`));
    const run = rows.map(r=>+r.run||0), push = rows.map(r=>+r.push||0);
    const swim = rows.map(r=>!!r.swim), hang = rows.map(r=>!!r.hang);
    const sum = a => a.reduce((x,v)=>x+v,0), cnt = a => a.filter(Boolean).length;
    const runT = Math.round(sum(run)*10)/10, pushT = sum(push), sw = cnt(swim), hg = cnt(hang);
    $("sSwim").innerHTML = `${sw}<small>일</small>`;
    $("sHang").innerHTML = `${hg}<small>일</small>`;
    $("sRun").innerHTML = `${fmt(runT)}<small>km</small>`;
    $("sPush").innerHTML = `${pushT}<small>개</small>`;
    const runDays = run.filter(v=>v>0).length, pushDays = push.filter(v=>v>0).length;
    $("runMeta").textContent = runDays ? `${runDays}일 달림 · 하루 평균 ${fmt(Math.round(runT/runDays*10)/10)}km` : "기록 없음";
    $("pushMeta").textContent = pushDays ? `${pushDays}일 · 하루 평균 ${Math.round(pushT/pushDays)}개` : "기록 없음";
    $("swimMeta").textContent = `${n}일 중 ${sw}일`;
    $("hangMeta").textContent = `${n}일 중 ${hg}일`;
    $("emptyNote").hidden = !!(runT||pushT||sw||hg);
    bars($("runChart"), run, "var(--run)", "km");
    bars($("pushChart"), push, "var(--push)", "개");
    cal($("swimCal"), swim, y, m);
    cal($("hangCal"), hang, y, m);
  }

  // ----- start: local copy first, then the saved store -----
  data = lsLoad();
  renderDay(); renderMonth();
  setStatus("이 브라우저에 저장됨");

  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      store = db.collection("data/users/" + uid);
      setStatus("동기화 중…");
      let first = true;
      store.onSnapshot(snap => {
        const fromDb = {};
        snap.docs.forEach(d => { const v = d.data(); if (v) fromDb[d.id] = {swim:!!v.swim, hang:!!v.hang, run:+v.run||0, push:+v.push||0}; });
        if (first) {
          // carry over anything recorded only in this browser
          Object.keys(data).forEach(k => { if (!fromDb[k]) persist(k, data[k]); });
          first = false;
        }
        data = Object.assign({}, data, fromDb);
        lsSave(); renderDay(); renderMonth();
        setStatus("저장됨 · 다른 기기에서도 보여요");
      }, () => setStatus("연결이 끊겼어요. 새로고침하면 다시 이어져요"));
    } catch(e) {}
  })();
})();
</script>

</body></html>
